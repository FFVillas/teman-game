     scripts/generate-pwa-icons.mjs, yang menempelkannya di kotak biru -- jadi
     berkas ini harus tetap PUTIH dan transparan. Versi berwarnanya ada di
     public/mascot/. Sumber: public/mascot/default.svg. -->
